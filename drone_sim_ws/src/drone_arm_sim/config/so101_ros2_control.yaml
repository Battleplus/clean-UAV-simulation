controller_manager:
  ros__parameters:
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
      - gripper
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    # Positions + velocities + accelerations from cartesian_arm_demo are
    # intentionally interpolated as quintic splines.  Keep this explicit so a
    # controller default change cannot reintroduce acceleration steps.
    interpolation_method: splines
    action_monitor_rate: 20.0
    state_publish_rate: 100.0
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
